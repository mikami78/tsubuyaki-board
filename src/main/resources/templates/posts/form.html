<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規投稿 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>新規投稿</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
    </nav>

    <form class="entry-form" th:action="@{/posts}" th:object="${postForm}" method="post">
        <div class="form-field">
            <label for="author">投稿者</label>
            <input type="text" id="author" th:field="*{author}" maxlength="30" required>
            <p class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">エラー</p>
        </div>
        <div class="form-field">
            <label for="body">本文 <span>280文字まで</span></label>
            <textarea id="body" th:field="*{body}" maxlength="280" rows="5" required></textarea>
            <p class="error" th:if="${#fields.hasErrors('body')}" th:errors="*{body}">エラー</p>
        </div>
        <div class="form-field">
            <label for="avatarColor">アバター色</label>
            <select id="avatarColor" th:field="*{avatarColor}">
                <option value="">未選択 (グレー)</option>
                <option value="red">赤</option>
                <option value="blue">青</option>
                <option value="green">緑</option>
                <option value="yellow">黄</option>
                <option value="gray">グレー</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('avatarColor')}" th:errors="*{avatarColor}">エラー</p>
        </div>
        <div class="form-actions">
            <button class="primary-button" type="submit">投稿</button>
        </div>
    </form>
</main>
</body>
</html>
